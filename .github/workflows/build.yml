# Every push and pull request: the logic tests, the validator's own regression
# tests, Promptly Unemployed's content checks, then every example packed and
# validated against its sources. The archives are kept as a workflow artifact
# for a fortnight; a tag is what publishes them.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: softn-examples
          path: dist/
          retention-days: 14
          if-no-files-found: error
