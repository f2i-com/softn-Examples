# Every push and pull request: the logic tests, the validator's own regression
# tests, Promptly Unemployed's content checks, then every example packed and
# validated against its sources. The archives are kept as a workflow artifact
# for a fortnight; a tag is what publishes them.
#
# Actions are pinned to the commit behind their tag, so a moved tag upstream
# cannot change what runs here without a change here.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: softn-examples
          path: dist/
          retention-days: 14
          if-no-files-found: error
